name: CI Quality Gates

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  quality-gates:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: "1.23"

    - name: Install dbus-daemon for isolated D-Bus integration tests
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq dbus

    - name: Run all 6 Mandatory Quality Gates
      run: |
        ./scripts/quality-gate.sh
